<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CatholicFitPlans - Training Intake</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0a1e;--surface:#111029;--card:#181640;--card2:#1e1c4a;--border:#252350;--border2:#302d6e;--pink:#ec4899;--violet:#8b5cf6;--teal:#2dd4bf;--gold:#fbbf24;--orange:#f97316;--red:#ef4444;--green:#34d399;--lgray:#c4b5d8;--mgray:#9585b8;--dgray:#5c5280}
body{background:var(--bg);color:#fff;font-family:Outfit,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:url('9E6DC135-0C7C-4D3C-A50D-143B7950C0E0.png');background-repeat:no-repeat;background-position:center;background-size:50%;opacity:.04;pointer-events:none;z-index:0}
header,.container,.toast,.bottom-nav{position:relative;z-index:1}
header{position:sticky;top:0;z-index:50;background:rgba(11,10,30,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--pink),var(--violet)) 1}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(236,72,153,.3)}
.bname{font-family:'DM Serif Display',serif;font-size:21px;letter-spacing:-.5px}
.bname b{color:var(--pink)}.bname i{color:#a78bfa;font-style:normal}
.bsub{font-size:9px;color:var(--dgray);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.sync-status{font-size:11px;color:var(--green);padding:6px 12px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:8px}
.sync-status.syncing{color:var(--gold);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
.sync-status.error{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.back-link{color:#a78bfa;font-size:12px;text-decoration:none;font-weight:600;padding:6px 12px;border:1px solid var(--violet);border-radius:8px}
.progress-bar{height:5px;background:var(--card);position:relative;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));width:0%;transition:width .4s ease;box-shadow:0 0 12px rgba(236,72,153,.6)}
.progress-text{position:absolute;top:8px;right:24px;font-size:10px;color:var(--lgray);font-weight:700;letter-spacing:.1em;z-index:5}
.container{max-width:780px;margin:0 auto;padding:32px 24px 100px;position:relative;z-index:1}
.step{display:none;animation:fadeIn .35s ease}
.step.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.step-label{font-size:11px;color:var(--violet);font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.step-title{font-family:'DM Serif Display',serif;font-size:32px;line-height:1.15;background:linear-gradient(135deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;margin-bottom:8px}
.step-sub{font-size:13px;color:var(--mgray);margin-bottom:24px;line-height:1.5}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px rgba(139,92,246,.06)}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--lgray);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.fi{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:#fff;font-family:Outfit;font-size:14px;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--violet)}
.ft{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:#fff;font-family:Outfit;font-size:13px;outline:none;resize:vertical;min-height:80px}
.fr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.fr,.fr2{grid-template-columns:1fr}}

/* PARQ Card */
.parq-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:26px;margin-bottom:14px;transition:all .3s}
.parq-card.answered{border-color:rgba(139,92,246,.4);box-shadow:0 4px 24px rgba(139,92,246,.1)}
.parq-num{display:inline-block;font-size:11px;color:var(--violet);font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
.parq-q{font-size:15px;line-height:1.5;color:#fff;margin-bottom:18px;font-weight:500}
.parq-yn{display:flex;gap:12px}
.parq-btn{flex:1;padding:14px;border:2px solid var(--border2);background:var(--card2);border-radius:12px;color:var(--lgray);font-family:Outfit;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.parq-btn:hover{border-color:var(--violet);color:#fff}
.parq-btn.sel-yes{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green);box-shadow:0 4px 14px rgba(52,211,153,.2)}
.parq-btn.sel-no{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red);box-shadow:0 4px 14px rgba(239,68,68,.2)}

/* Movement test card */
.mov-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:24px;margin-bottom:14px}
.mov-card-h{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.mov-svg{flex:0 0 130px;background:var(--card2);border-radius:14px;padding:10px;display:grid;place-items:center;border:1px solid var(--border2)}
.mov-svg svg{width:110px;height:130px;display:block}
.mov-info{flex:1;min-width:200px}
.mov-name{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:4px;line-height:1.2}
.mov-num{font-size:10px;color:var(--violet);font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.mov-desc{font-size:12px;color:var(--mgray);line-height:1.5}
.mov-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.mov-fields{grid-template-columns:1fr}}
.mov-fields .full label{display:flex;gap:8px;align-items:center;cursor:pointer;padding:10px 12px;background:var(--card2);border:1px solid var(--border2);border-radius:9px;font-size:13px;font-weight:600;transition:all .2s}
.mov-fields .full{display:flex;gap:8px}
.mov-fields .full label.sel-y{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.mov-fields .full label.sel-n{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red)}
.mov-fields .full label input{cursor:pointer}
.mov-fields .full label{flex:1}
.mov-disc{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mov-disc label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--lgray);cursor:pointer}
.mov-section-title{font-size:9px;color:var(--dgray);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.mov-notes{margin-top:14px}

/* Eval card */
.eval-card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px}
.eval-card-h{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.eval-svg{flex:0 0 90px;background:var(--card2);border-radius:12px;padding:8px;display:grid;place-items:center;border:1px solid var(--border2)}
.eval-svg svg{width:74px;height:90px;display:block}
.eval-info{flex:1;min-width:180px}
.eval-name{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.2}
.eval-unit{font-size:11px;color:var(--violet);margin-top:3px;font-weight:600}

/* Bottom navigation */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,10,30,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:100}
.btn-back,.btn-next{padding:12px 24px;border-radius:10px;font-family:Outfit;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-back{background:transparent;border:1px solid var(--border2);color:var(--lgray)}
.btn-back:hover{border-color:var(--violet);color:#fff}
.btn-back:disabled{opacity:.4;cursor:not-allowed}
.btn-next{background:linear-gradient(135deg,var(--pink),var(--violet));border:0;color:#fff;box-shadow:0 4px 18px rgba(236,72,153,.4)}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(236,72,153,.55)}
.step-counter{font-size:11px;color:var(--mgray);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;bottom:80px;right:20px;background:var(--card2);border:1px solid var(--green);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--green);font-weight:600;transform:translateY(80px);opacity:0;transition:all .3s;z-index:2000}
.toast.on{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--red);color:var(--red)}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.summary-row:last-child{border-bottom:0}
.summary-label{color:var(--mgray)}
.summary-val{color:#fff;font-weight:600;text-align:right}
.btn-pdf-final{padding:14px 22px;border-radius:12px;background:var(--card2);border:1px solid var(--violet);color:#a78bfa;font-family:Outfit;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="9E6DC135-0C7C-4D3C-A50D-143B7950C0E0.png" alt="Logo"/>
    <div>
      <div class="bname"><b>CatholicFit</b><i>Plans</i></div>
      <div class="bsub">Training Intake Form</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <a href="index.html" class="back-link">&larr; Back to App</a>
    <div class="sync-status" id="sync-status">Ready</div>
  </div>
</header>

<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<div class="container" id="steps-container"></div>

<div class="bottom-nav">
  <button class="btn-back" id="btn-back" type="button">&larr; Back</button>
  <div class="step-counter" id="step-counter">Step 1</div>
  <button class="btn-next" id="btn-next" type="button">Next &rarr;</button>
</div>

<div class="toast" id="toast"></div>

<script src="intake.js"></script>
</body>
</html>
