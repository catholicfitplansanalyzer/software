<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CatholicFitPlans - Nutrition Dashboard (Coach)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0a1e;--surface:#111029;--card:#181640;--card2:#1e1c4a;--border:#252350;--border2:#302d6e;--pink:#ec4899;--violet:#8b5cf6;--teal:#2dd4bf;--gold:#fbbf24;--orange:#f97316;--red:#ef4444;--green:#34d399;--lgray:#c4b5d8;--mgray:#9585b8;--dgray:#5c5280}
body{background:var(--bg);color:#fff;font-family:Outfit,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:rgba(11,10,30,.95);backdrop-filter:blur(10px);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--pink),var(--violet)) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(236,72,153,.3)}
.bname{font-family:'DM Serif Display',serif;font-size:21px}
.bname b{color:var(--pink)}.bname i{color:#a78bfa;font-style:normal}
.bsub{font-size:9px;color:var(--dgray);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.coach-badge{font-size:10px;color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--gold);border-radius:8px}
.btn-refresh{padding:8px 16px;background:transparent;border:1px solid var(--violet);color:#a78bfa;border-radius:8px;font-family:Outfit;font-size:12px;font-weight:700;cursor:pointer}
.btn-refresh:hover{background:rgba(139,92,246,.1)}
.container{max-width:1100px;margin:0 auto;padding:24px}
.title{font-family:'DM Serif Display',serif;font-size:32px;background:linear-gradient(135deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;margin-bottom:6px}
.subtitle{font-size:13px;color:var(--mgray);margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-num{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--mgray);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:4px}
.search-bar{margin-bottom:20px}
.search-input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;color:#fff;font-family:Outfit;font-size:14px;outline:none}
.search-input:focus{border-color:var(--violet)}
.empty{text-align:center;padding:60px 20px;color:var(--mgray)}
.empty h3{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px;color:var(--lgray)}
.client-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;transition:all .2s}
.client-card:hover{border-color:rgba(139,92,246,.4);box-shadow:0 4px 24px rgba(139,92,246,.1)}
.client-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.client-info{flex:1;min-width:200px}
.client-name{font-family:'DM Serif Display',serif;font-size:22px;color:#fff}
.client-meta{font-size:12px;color:var(--mgray);margin-top:4px}
.client-meta span{margin-right:14px}
.goal-badge{display:inline-block;padding:5px 12px;background:rgba(139,92,246,.15);border:1px solid var(--violet);border-radius:20px;font-size:11px;color:#a78bfa;font-weight:700;margin-top:6px}
.client-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-view{padding:10px 18px;background:linear-gradient(135deg,var(--pink),var(--violet));border:0;border-radius:8px;color:#fff;font-family:Outfit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.05em;text-transform:uppercase}
.btn-pdf{padding:10px 18px;background:transparent;border:1px solid var(--violet);color:#a78bfa;border-radius:8px;font-family:Outfit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.05em;text-transform:uppercase}
.modal{display:none;position:fixed;inset:0;background:rgba(5,4,20,.85);z-index:1000;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal.on{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:780px;max-height:92vh;overflow-y:auto;margin:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:10}
.modal-h h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--pink)}
.modal-x{background:0;border:0;color:var(--dgray);font-size:24px;cursor:pointer}
.modal-b{padding:22px}
.modal-section{margin-bottom:22px}
.modal-section h3{font-size:11px;color:var(--violet);font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.modal-section .field{margin-bottom:10px}
.modal-section .label{font-size:10px;color:var(--mgray);letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.modal-section .value{font-size:13px;color:#fff;line-height:1.6;white-space:pre-wrap;background:var(--card2);padding:10px 12px;border-radius:8px;border-left:3px solid var(--violet)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--green);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--green);font-weight:600;transform:translateY(80px);opacity:0;transition:all .3s;z-index:2000}
.toast.on{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--red);color:var(--red)}
.loader{display:flex;justify-content:center;padding:40px;color:var(--mgray)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="9E6DC135-0C7C-4D3C-A50D-143B7950C0E0.png" alt="Logo"/>
    <div>
      <div class="bname"><b>CatholicFit</b><i>Plans</i></div>
      <div class="bsub">Nutrition Dashboard</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="coach-badge">Coach View</span>
    <button class="btn-refresh" id="btn-refresh" type="button">Refresh</button>
  </div>
</header>

<div class="container">
  <div class="title">Nutrition Submissions</div>
  <div class="subtitle">All client nutrition forms - For coach use only</div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Submissions</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-today">0</div><div class="stat-label">Today</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-week">0</div><div class="stat-label">This Week</div></div>
  </div>

  <div class="search-bar">
    <input class="search-input" id="search" placeholder="Search by name or email..."/>
  </div>

  <div id="list">
    <div class="loader">Loading submissions...</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-h">
      <h2 id="modal-name">Client Details</h2>
      <button class="modal-x" id="modal-close" type="button">&times;</button>
    </div>
    <div class="modal-b" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="nutrition-coach.js"></script>
</body>
</html>
